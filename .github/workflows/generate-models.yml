name: Generate Models and Sids

on:
  repository_dispatch:
    types: [openapi-updated]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout OpenAPI spec
        uses: actions/checkout@v4
        with:
          repository: wellnessliving/openapi
          path: openapi-spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate models and Sids
        env:
          OPENAPI_PATH: ${{ github.workspace }}/openapi-spec/dev/openapi.yaml
        run: node scripts/generate-models.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WellnessLiving/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate models and Sids from dev OpenAPI spec"
            git push
          fi
